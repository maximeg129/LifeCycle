# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Environment variables and secrets. A secret referenced here must already
# exist in Secret Manager (see `firebase apphosting:secrets:set`) and be
# granted access to this backend before it will actually reach the app.
env:
  - variable: ANTHROPIC_API_KEY
    secret: anthropic-api-key
    availability:
      - BUILD
      - RUNTIME
  # Publication Strava (voir CLAUDE.md "Publication Strava") — client_id/
  # client_secret d'une application API Strava enregistrée par l'athlète
  # sur son propre compte (developers.strava.com → "My API Application").
  # Ni l'un ni l'autre n'est nécessaire au BUILD : lus uniquement au
  # runtime, dans src/app/api/strava/{authorize,callback,refresh}/route.ts.
  - variable: STRAVA_CLIENT_ID
    secret: strava-client-id
    availability:
      - RUNTIME
  - variable: STRAVA_CLIENT_SECRET
    secret: strava-client-secret
    availability:
      - RUNTIME
  # Analyse automatique de sortie vélo via webhook (chantier "repenser
  # planification/séances/feedback", pièce B2, voir CLAUDE.md) —
  # client_id/client_secret d'une "Application" Intervals.icu enregistrée
  # par l'athlète sur son propre compte (intervals.icu/oauth/apply, statut
  # "Pending" en attente d'approbation par Intervals.icu). Ni l'un ni
  # l'autre n'est nécessaire au BUILD (même posture que STRAVA_CLIENT_*
  # ci-dessus) : lus uniquement au runtime, dans
  # src/app/api/intervals-oauth/{authorize,callback}/route.ts.
  - variable: INTERVALS_OAUTH_CLIENT_ID
    secret: intervals-oauth-client-id
    availability:
      - RUNTIME
  - variable: INTERVALS_OAUTH_CLIENT_SECRET
    secret: intervals-oauth-client-secret
    availability:
      - RUNTIME
  # Secret embarqué par Intervals.icu dans chaque payload de webhook (voir
  # leur doc, section "Configure webhooks") — renseigné sur la page "Manage
  # App" une fois l'application approuvée, PUIS collé ici. Vérifié dans
  # src/app/api/intervals/webhook/route.ts pour confirmer qu'une requête
  # vient bien d'Intervals.icu avant de déclencher quoi que ce soit.
  - variable: INTERVALS_WEBHOOK_SECRET
    secret: intervals-webhook-secret
    availability:
      - RUNTIME
  # Notifications push (chantier "repenser planification/séances/feedback",
  # voir CLAUDE.md) — la clé PUBLIQUE "Web Push certificate" générée dans
  # Firebase Console → Project Settings → Cloud Messaging → Web
  # configuration → "Generate key pair". Pas un secret (c'est la clé
  # publique utilisée par l'API Push du navigateur, jamais la clé privée
  # associée que Firebase garde côté serveur) — un simple `env`, pas un
  # `secret` Secret Manager. `NEXT_PUBLIC_` : lue côté client par
  # use-push-notifications.ts, donc nécessaire au BUILD (inlinée dans le
  # bundle par Next.js) en plus du RUNTIME.
  #
  # ⚠️ Bug réel corrigé : une entrée `value: ""` (chaîne vide, tant que la
  # clé n'est pas encore générée) faisait échouer le build en prod —
  # Firebase App Hosting refuse le fichier avec "either 'value' or
  # 'secret' field is required" dès qu'une entrée `env` a `value` vide,
  # une chaîne vide n'étant apparemment pas considérée comme une valeur
  # valide par son schéma. use-push-notifications.ts gère déjà
  # gracieusement l'ABSENCE totale de cette variable (`isConfigured: false`,
  # aucune tentative d'enregistrement) — l'entrée est donc omise ici tant
  # qu'aucune vraie clé n'est disponible, comportement identique à un
  # `value: ""` réussi, sans les faux frais du bug de schéma. À
  # réintroduire avec la vraie clé une fois générée :
  # - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
  #   value: "<clé réelle>"
  #   availability:
  #     - BUILD
  #     - RUNTIME
