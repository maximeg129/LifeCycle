# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Environment variables and secrets. A secret referenced here must already
# exist in Secret Manager (see `firebase apphosting:secrets:set`) and be
# granted access to this backend before it will actually reach the app.
env:
  - variable: ANTHROPIC_API_KEY
    secret: anthropic-api-key
    availability:
      - BUILD
      - RUNTIME
  # Publication Strava (voir CLAUDE.md "Publication Strava") — client_id/
  # client_secret d'une application API Strava enregistrée par l'athlète
  # sur son propre compte (developers.strava.com → "My API Application").
  # Ni l'un ni l'autre n'est nécessaire au BUILD : lus uniquement au
  # runtime, dans src/app/api/strava/{authorize,callback,refresh}/route.ts.
  - variable: STRAVA_CLIENT_ID
    secret: strava-client-id
    availability:
      - RUNTIME
  - variable: STRAVA_CLIENT_SECRET
    secret: strava-client-secret
    availability:
      - RUNTIME
